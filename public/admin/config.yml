backend:
  name: git-gateway
  # Uncomment the line below for local development
  # name: local

media_folder: 'public/uploads' # Where media files will be stored
public_folder: '/uploads' # The src attribute for uploaded media

collections:
  - name: 'blog'
    label: 'Blog'
    folder: 'content/blog' # The path to the folder where the documents are stored
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Author', name: 'author', widget: 'string' }
      - { label: 'Summary', name: 'summary', widget: 'text' }
      - { label: 'Image ID', name: 'image_id', widget: 'string' }
      - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: 'Body', name: 'body', widget: 'markdown' }
