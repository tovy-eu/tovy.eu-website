name: Firebase CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write # Required for commenting preview URLs on PRs
  checks: write # Required for creating deployment checks on PRs

jobs:
  test_and_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm install
          cd functions && npm install

      - name: Lint project
        run: npm run lint
        continue-on-error: true # Temporarily allowed due to ESLint 9 / Next 15 circular dependency bug

      - name: Typecheck project
        run: npm run typecheck

  preview:
    if: github.event_name == 'pull_request'
    needs: test_and_lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/553043672473/locations/global/workloadIdentityPools/github-actions/providers/github-provider'
          service_account: 'firebase-adminsdk-fbsvc@studio-5767764867-ecdbc.iam.gserviceaccount.com'

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-VL0FR2B3DH"
        run: npm run build

      - name: Deploy to Firebase Preview Channel
        run: |
          CHANNEL_ID="pr-${{ github.event.pull_request.number }}-${{ github.head_ref }}"
          # Clean channel ID (lowercase, replace invalid chars with dashes, max 40 chars)
          CLEAN_CHANNEL_ID=$(echo "$CHANNEL_ID" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/_/' | cut -c 1-40 | sed 's/_$//')
          
          # Deploy to the specific preview channel
          npx firebase-tools hosting:channel:deploy "$CLEAN_CHANNEL_ID" --expires 7d --project studio-5767764867-ecdbc

  deploy_production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test_and_lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/553043672473/locations/global/workloadIdentityPools/github-actions/providers/github-provider'
          service_account: 'firebase-adminsdk-fbsvc@studio-5767764867-ecdbc.iam.gserviceaccount.com'

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-VL0FR2B3DH"
        run: npm run build

      - name: Deploy to Firebase Hosting (Production)
        run: npx firebase-tools deploy --only hosting --project studio-5767764867-ecdbc
